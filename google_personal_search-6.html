    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
  }

  .glass {
    width:min(760px, 94vw);
    padding:42px 34px 36px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:30px;
    background:rgba(15,15,22,.24);
    box-shadow:0 24px 80px rgba(0,0,0,.42);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    text-align:center;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) both;
  }

  .logo {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:1px;
    margin-bottom:30px;
    font-size:clamp(64px, 12vw, 104px);
    font-weight:500;
    letter-spacing:-7px;
    line-height:.9;
    user-select:none;
  }

  .letter {
    display:inline-block;
    opacity:0;
    filter:blur(12px);
    transform:translateY(70px) scale(.65) rotate(var(--r));
    animation:letterIn .85s cubic-bezier(.17,.89,.32,1.28) forwards;
    animation-delay:var(--d);
    text-shadow:0 6px 28px rgba(0,0,0,.32);
  }

  .blue { color:#4285F4; --r:-8deg; }
  .red { color:#EA4335; --r:7deg; }
  .yellow { color:#FBBC05; --r:-5deg; }
  .green { color:#34A853; --r:8deg; }

  .search {
    display:flex;
    align-items:center;
    width:100%;
    height:62px;
    padding:0 10px 0 20px;
    border-radius:34px;
    background:rgba(255,255,255,.96);
    box-shadow:0 12px 35px rgba(0,0,0,.3);
    animation:searchIn 1s .65s both cubic-bezier(.2,.8,.2,1);
  }

  .search-icon {
    width:22px;
    height:22px;
    margin-right:12px;
    flex:none;
    border:2px solid #777;
    border-radius:50%;
    position:relative;
  }
  .search-icon::after {
    content:"";
    position:absolute;
    width:9px;
    height:2px;
    background:#777;
    right:-7px;
    bottom:-4px;
    transform:rotate(45deg);
    border-radius:2px;
  }

  #query {
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#202124;
    font-size:18px;
  }
  #query::placeholder { color:#777; }
.search-btn:hover {
    transform:translateY(-1px);
    box-shadow:0 5px 16px rgba(66,133,244,.45);
  }
  .search-btn:active { transform:scale(.97); }

  .hint {
    margin-top:18px;
    color:rgba(255,255,255,.76);
    font-size:13px;
    animation:fadeIn 1s 1.25s both;
  }

  .chips {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
    margin-top:20px;
    animation:fadeIn 1s 1.4s both;
  }
  .chip {
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.09);
    color:#fff;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
    backdrop-filter:blur(5px);
    transition:.2s;
  }
  .chip:hover { background:rgba(255,255,255,.18); transform:translateY(-2px); }

  .footer {
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:16px;
    z-index:3;
    width:max-content;
    max-width:90vw;
    color:rgba(255,255,255,.55);
    font-size:11px;
    letter-spacing:.4px;
  }

  .hint {
    min-height: 20px;
    font-style: italic;
    letter-spacing: .2px;
  }

  @keyframes quoteIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }

  .quote-change {
    animation:quoteIn .65s ease both;
  }


  .icon-btn {
    width:44px;
    height:44px;
    flex:none;
    display:grid;
    place-items:center;
    border:0;
    background:transparent;
    color:#5f6368;
    border-radius:50%;
    cursor:pointer;
    transition:.2s ease;
  }
  .icon-btn:hover { background:rgba(60,64,67,.10); transform:scale(1.04); }
  .icon-btn:active { transform:scale(.94); }
  .icon-btn img { width:25px; height:25px; object-fit:contain; display:block; }
.quick-links {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-top:18px;
    animation:fadeIn 1s 1.05s both;
  }

  .quick-link {
    min-width:118px;
    height:54px;
    padding:0 18px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    background:rgba(52,52,68,.78);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:15px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 5px 18px rgba(0,0,0,.16);
    transition:.2s ease;
  }
  .quick-link:hover {
    background:rgba(72,72,90,.9);
    transform:translateY(-2px);
  }
  .quick-link:active { transform:scale(.97); }

  .quick-icon {
    width:24px;
    height:24px;
    display:grid;
    place-items:center;
    font-size:22px;
    line-height:1;
  }
  .weather-icon { color:#fbbc04; }
  .youtube-icon { color:#ff4b4b; font-size:17px; }

  .voice-active {
    color:#4285F4 !important;
    background:rgba(66,133,244,.12) !important;
    animation:pulseMic 1s infinite;
  }
  @keyframes pulseMic {
    50% { box-shadow:0 0 0 7px rgba(66,133,244,.10); }
  }

  .status-message {
    position:fixed;
    left:50%;
    bottom:55px;
    transform:translateX(-50%);
    z-index:5;
    padding:10px 16px;
    border-radius:20px;
    background:rgba(20,20,25,.84);
    color:#fff;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    white-space:nowrap;
  }
  .status-message.show { opacity:1; }

  @keyframes letterIn {
    0% { opacity:0; filter:blur(12px); transform:translateY(70px) scale(.65) rotate(var(--r)); }
    65% { opacity:1; filter:blur(0); transform:translateY(-10px) scale(1.07) rotate(calc(var(--r) * -0.35)); }
    100% { opacity:1; filter:blur(0); transform:translateY(0) scale(1) rotate(0); }
  }
  @keyframes searchIn {
    from { opacity:0; transform:translateY(35px) scale(.92); }
    to { opacity:1; transform:none; }
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(25px); }
    to { opacity:1; transform:none; }
  }
  @keyframes fadeIn {
    from { opacity:0; }
    to { opacity:1; }
  }

  @media (max-width:600px) {
    .glass { padding:34px 16px 28px; border-radius:24px; }
    .logo { margin-bottom:25px; letter-spacing:-5px; }
    .search { height:56px; padding-left:16px; }
.icon-btn { width:38px; height:38px; }
    .icon-btn img { width:23px; height:23px; object-fit:contain; display:block; }
    .quick-link { min-width:105px; height:50px; padding:0 13px; font-size:14px; }
    #query { font-size:16px; }
  }
</style>
</head>

<div class="status-message" id="statusMessage"></div>
<div class="footer">Made by- HMS❤️‍🩹</div>

<script>
  const form = document.getElementById('searchForm');
  const input = document.getElementById('query');
  const micBtn = document.getElementById('micBtn');
  const lensBtn = document.getElementById('lensBtn');
  const statusMessage = document.getElementById('statusMessage');

  function search(q) {
    q = q.trim();
    if (!q) return;
    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
  }

  function showStatus(message) {
    statusMessage.textContent = message;
    statusMessage.classList.add('show');
    clearTimeout(window.__statusTimer);
    window.__statusTimer = setTimeout(() => {
      statusMessage.classList.remove('show');
    }, 2200);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    search(input.value);
  });

  document.querySelectorAll('.quick-link').forEach(button => {
    button.addEventListener('click', () => {
      window.location.href = button.dataset.url;
    });
  });

  // Working voice search using the browser's Web Speech API.
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-IN';
    recognition.interimResults = false;
    recognition.continuous = false;

    micBtn.addEventListener('click', () => {
      try {
        recognition.start();
        micBtn.classList.add('voice-active');
        showStatus('Listening… speak now');
      } catch (err) {}
    });

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      input.value = transcript;
      micBtn.classList.remove('voice-active');
      search(transcript);
    };

    recognition.onerror = () => {
      micBtn.classList.remove('voice-active');
      showStatus('Voice search could not start');
    };

    recognition.onend = () => micBtn.classList.remove('voice-active');
  } else {
    micBtn.addEventListener('click', () => {
      showStatus('Voice search is not supported in this browser');
    });
  }

  // Google Lens: opens Google's Lens page in a new tab.
  lensBtn.addEventListener('click', () => {
    window.open('https://lens.google.com/', '_blank', 'noopener,noreferrer');
  });

</script>
